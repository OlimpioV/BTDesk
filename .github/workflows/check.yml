name: check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxe dos scripts (node --check)
        run: |
          for f in *.js scripts/*.mjs; do
            echo "check $f"
            node --check "$f"
          done

      - name: Referencias de handlers (onclick etc.)
        run: node scripts/check-refs.mjs --strict
